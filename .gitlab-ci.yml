variables:
  KC_ISSUER: https://sso.sikalabs.com/realms/training
  KC_CLIENT_ID: gitlab_ci_project_827

test:
  image: alpine:3.22
  id_tokens:
    KC_JWT:
      aud: https://sso.sikalabs.com/realms/training
  before_script:
    - apk add --no-cache curl jq
  script:
    - ./scripts/ci-get-approved-token.sh > token.local.txt
    # Show who approved and which client issued it (never print the token itself)
    - jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {iss, sub, preferred_username, azp, aud, exp}' token.local.txt
