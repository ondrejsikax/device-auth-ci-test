image: ghcr.io/sikalabsregistry/wip/ci:2026-11-11.4

variables:
  KC_ISSUER: https://sso.sikalabs.com/realms/training
  KC_CLIENT_ID: gitlab_ci_project_827

test:
  id_tokens:
    KC_JWT:
      aud: https://sso.sikalabs.com/realms/training
  script:
    # Prints approval link to the log, approver (username, email, sub) to the log,
    # Access Token (sub=user, azp=client) to the file
    - go run . --issuer $KC_ISSUER --client-id $KC_CLIENT_ID --client-assertion $KC_JWT > token.local.txt
    - cat token.local.txt
    - cat token.local.txt | slr parse-jwt - | jq
